<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --soft: #f6f3ef;
    --soft-2: #efe9e2;
    --ink: #161616;
    --muted: #6b6661;
    --line: #e6e0d9;
    --accent: #d6402b;
    --accent-2: #b8321f;
    --accent-soft: #fdebe7;
    --gold: #f5a623;
    --ok: #1f8a4c;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 "Inter", system-ui, -apple-system, sans-serif;
    padding-bottom: calc(76px + var(--cookie-h, 0px));
  }
  :root[lang="ka"] body { font-family: "Noto Sans Georgian", "Inter", system-ui, sans-serif; }
  img, video { max-width: 100%; display: block; }
  button, input, select { font: inherit; color: inherit; }
  a { color: inherit; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 16px; }
  h1, h2, h3 { line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: clamp(24px, 4.6vw, 36px); font-weight: 800; }
  section { padding: 44px 0; }
  .center { text-align: center; }
  .muted { color: var(--muted); }
  .stars { color: var(--gold); letter-spacing: 1px; white-space: nowrap; }
  /* общий рейтинг: последняя звезда закрашена примерно на 2/3 */
  .stars.part { display: inline-block; letter-spacing: 0; color: transparent; background: linear-gradient(90deg, var(--gold) 93%, #d6d6d6 93%); -webkit-background-clip: text; background-clip: text; }

  /* ---------- promo bar ---------- */
  .promo {
    background: var(--accent); color: #fff; text-align: center;
    font-size: 13px; font-weight: 700; padding: 8px 12px; letter-spacing: .02em;
  }
  .promo b { text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- header ---------- */
  header.top { border-bottom: 1px solid var(--line); background: #fff; position: sticky; top: 0; z-index: 30; }
  header.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .logo { font-weight: 800; font-size: 20px; letter-spacing: .08em; color: var(--accent); text-decoration: none; font-family: "Inter", sans-serif; display: inline-flex; align-items: center; gap: 8px; }
  .logo .flag { width: 27px; height: 18px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,.12); flex: none; }
  .langs { display: flex; gap: 4px; }
  .langs button {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 4px 10px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .langs button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* ---------- product ---------- */

  .product > * { min-width: 0; }
  @media (min-width: 900px) { .product { grid-template-columns: 1.1fr 1fr; gap: 44px; padding-top: 28px; } .buy { position: sticky; top: 76px; align-self: start; } }

  .gallery .main {
    position: relative; border-radius: var(--radius); overflow: hidden; background: var(--soft);
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  }
  .gallery .main::-webkit-scrollbar { display: none; }
  .gallery .slide { flex: 0 0 100%; scroll-snap-align: start; position: relative; aspect-ratio: 1 / 1; }
  .gallery .slide img, .gallery .slide video { width: 100%; height: 100%; object-fit: cover; }
  .gallery .slide.contain img { object-fit: contain; background: #fff; }
  .gallery .snd {
    position: absolute; right: 12px; bottom: 12px; width: 44px; height: 44px; border-radius: 50%;
    border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 20px; cursor: pointer;
    display: grid; place-items: center;
  }
  .slogan {
    position: absolute; left: 14px; top: 14px; max-width: 80%; pointer-events: none;
    background: rgba(255,255,255,.82); padding: 6px 12px 8px; border-radius: 12px;
    font-weight: 800; font-size: clamp(28px, 7vw, 40px); line-height: 1; color: var(--accent);
    font-style: italic; letter-spacing: -0.02em;

  .badge-kg {
    position: absolute; right: 14px; bottom: 14px; background: #fff; border-radius: 12px;

  .badge-kg b { display: block; font-size: 26px; line-height: 1; color: var(--accent); }
  .badge-kg span { font-size: 11px; color: var(--muted); }
  .thumbs { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .thumbs button {
    flex: 0 0 64px; height: 64px; border-radius: 10px; overflow: hidden; padding: 0;
    border: 2px solid transparent; background: var(--soft); cursor: pointer; position: relative;
  }
  .thumbs button[aria-current="true"] { border-color: var(--ink); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; }
  .thumbs .play::after {
    content: "▶"; position: absolute; inset: 0; display: grid; place-items: center;
    color: #fff; font-size: 18px; background: rgba(0,0,0,.25);
  }

  .rating-line { display: flex; align-items: center; gap: 8px; font-size: 14px; flex-wrap: wrap; }

  .buy h1 { font-size: clamp(26px, 5.4vw, 38px); font-weight: 800; margin: 8px 0 6px; }
  :root[lang="ka"] .buy h1 { font-size: clamp(22px, 4.8vw, 32px); }
  .buy .sub { color: var(--muted); margin: 0 0 14px; }
  .price-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

  .tag-sale { background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; border-radius: 6px; padding: 3px 8px; }

  .loved {
    display: flex; align-items: center; gap: 10px; margin: 14px 0; padding: 10px 12px;
    background: var(--soft); border-radius: 12px; font-size: 14px;
  }
  .avatars { display: flex; flex: 0 0 auto; }
  .avatars img { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; margin-left: -10px; }
  .avatars img:first-child { margin-left: 0; }

  .offer {
    border: 1.5px dashed var(--accent); background: var(--accent-soft); border-radius: 12px;
    padding: 10px 12px; font-size: 14px; display: flex; gap: 10px; align-items: center;
  }
  .offer .pill { background: var(--accent); color: #fff; font-weight: 800; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }

  .packs-title { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-align: center; margin: 18px 0 8px; color: var(--muted); }
  .packs { display: grid; gap: 8px; }
  .packs[hidden], .line-item[hidden] { display: none; }
  .pack {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
    border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; position: relative; background: #fff;
  }
  .pack input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }
  .pack:has(input:checked) { border-color: var(--accent); background: #fffaf8; box-shadow: 0 0 0 1px var(--accent) inset; }
  .pack .nm { font-weight: 700; display: block; }
  .pack .ds { font-size: 13px; color: var(--muted); }
  .pack .rows { display: grid; gap: 4px; grid-column: 2 / 4; }
  .pack .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 700; }
  .pack .row .pr { white-space: nowrap; }
  .buy2 h2 { margin: 14px 0 0; }
  .gallery2 .main { margin-top: 0; }
  .pack .pr { text-align: right; font-weight: 800; }
  .pack .pr s { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
  .pack .flag {
    position: absolute; top: -10px; right: 12px; background: var(--accent); color: #fff;
    font-size: 11px; font-weight: 800; border-radius: 999px; padding: 2px 9px; letter-spacing: .03em;
  }
  .stock { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ok); margin: 12px 0 10px; font-weight: 600; }
  .stock::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(31,138,76,.15); }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    background: var(--accent); color: #fff; border: 0; border-radius: 12px; min-height: 54px;
    font-weight: 800; font-size: 17px; cursor: pointer; text-decoration: none; padding: 0 16px; text-align: center;
  }
  .btn:hover { background: var(--accent-2); }
  .btn-ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--ink); }
  .btn-ghost:hover { background: var(--soft); }
  .btn-wa { background: #1fa855; }
  .btn-wa:hover { background: #178a45; }
  .pay-note { text-align: center; font-size: 13px; color: var(--muted); margin: 8px 0 0; }

  .timeline { display: grid; grid-template-columns: repeat(3, 1fr); margin: 22px 0 6px; position: relative; }
  .timeline::before { content: ""; position: absolute; left: 16%; right: 16%; top: 21px; border-top: 2px dashed var(--line); }
  .tl { text-align: center; position: relative; font-size: 12.5px; }
  .tl .ic { width: 42px; height: 42px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; margin: 0 auto 6px; font-size: 20px; position: relative; }
  .tl b { display: block; font-size: 13px; }
  .tl span { color: var(--muted); }

  .checks { list-style: none; padding: 0; margin: 16px 0; display: grid; gap: 8px; }
  .checks li { display: flex; gap: 10px; align-items: flex-start; }
  .checks li::before {
    content: "✓"; flex: 0 0 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff;
    font-size: 12px; font-weight: 800; display: grid; place-items: center; margin-top: 2px;
  }

  .media-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 18px; }
  @media (min-width: 760px) { .media-grid { grid-template-columns: repeat(5, 1fr); } }
  .media-grid button { aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; padding: 0; border: 0; background: var(--soft); cursor: zoom-in; position: relative; }
  .media-grid img, .media-grid video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .media-grid .play { position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; display: grid; place-items: center; }
  .media-sub { text-align: center; color: var(--muted); margin: 6px 0 0; font-size: 15px; }
  .kit { margin-top: 18px; border: 1px solid var(--line, #eee); border-radius: 14px; padding: 12px; }
  .kit-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .kit ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .kit li { background: var(--soft); border-radius: 10px; padding: 10px 6px; font-size: 13px; line-height: 1.25; }
  .kit li span { display: block; font-size: 22px; margin-bottom: 4px; }
  .kit li b { display: block; }
  .kit li small { color: var(--muted); font-size: 11.5px; }

  .paybox { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 14px; padding: 10px; border-radius: 12px; background: var(--soft); font-size: 14px; font-weight: 600; text-align: center; }

  /* ---------- sections ---------- */
  .hero2 { position: relative; border-radius: var(--radius); overflow: hidden; }
  .hero2 img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: center 65%; }
  @media (max-width: 759px) { .hero2 img { aspect-ratio: 4 / 5; } }
  .hero2 .cap {
    position: absolute; inset: auto 0 0 0; padding: 60px 20px 20px; color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,.7));
  }
  .hero2 .cap h2 { color: #fff; }
  .hero2 .cap p { margin: 6px 0 0; opacity: .9; }

  .steps { display: grid; gap: 14px; margin-top: 22px; }
  @media (min-width: 760px) { .steps { grid-template-columns: repeat(3, 1fr); } }
  .step { background: var(--soft); border-radius: var(--radius); padding: 18px; }
  .step .n { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; display: grid; place-items: center; margin-bottom: 10px; }
  .step h3 { font-size: 18px; margin-bottom: 4px; }
  .step p { margin: 0; color: var(--muted); font-size: 15px; }
  .warn { margin-top: 14px; font-size: 14px; background: #fff7e6; border: 1px solid #f3d9a4; border-radius: 10px; padding: 10px 12px; }
  .video-box { margin-top: 18px; border-radius: var(--radius); overflow: hidden; background: #000; max-width: 420px; margin-left: auto; margin-right: auto; }
  .video-box video { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; }

  .specs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 22px; }
  @media (min-width: 760px) { .specs { grid-template-columns: repeat(4, 1fr); } }
  .spec { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .spec b { display: block; font-size: 24px; font-weight: 800; color: var(--accent); }
  .spec span { font-size: 14px; color: var(--muted); }

  .compare { margin-top: 22px; display: grid; grid-template-columns: 1.1fr 1fr 1fr; font-size: 14px; border-radius: var(--radius); overflow: hidden; }
  .compare div { padding: 12px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
  .compare .h { font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 0; }
  .compare .us { background: #e6f6ea; color: #1e7a3a; font-weight: 700; justify-content: center; text-align: center; }
  .compare .them { background: var(--accent-soft); color: var(--accent-2); font-weight: 700; justify-content: center; text-align: center; }
  .compare .lbl { font-weight: 600; }

  .rv-head { display: grid; gap: 18px; margin-top: 22px; align-items: center; }
  @media (min-width: 760px) { .rv-head { grid-template-columns: 260px 1fr; } }
  .big-score { text-align: center; }
  .big-score b { font-size: 56px; font-weight: 800; line-height: 1; display: block; }
  .bars { display: grid; gap: 6px; font-size: 13px; }
  .bar { display: grid; grid-template-columns: 54px 1fr 44px; gap: 8px; align-items: center; }
  .bar i { display: block; height: 8px; border-radius: 4px; background: var(--soft-2); overflow: hidden; }
  .bar i::before { content: ""; display: block; height: 100%; width: var(--w); background: var(--gold); }
  .bar em { font-style: normal; color: var(--muted); text-align: right; }
  .reviews { display: grid; gap: 12px; margin-top: 24px; }
  @media (min-width: 760px) { .reviews { grid-template-columns: repeat(2, 1fr); } }
  .rv { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .rv .who { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .rv .who b { font-size: 15px; }
  .rv p { margin: 8px 0 0; }
  .rv .ver { font-size: 12px; color: var(--ok); font-weight: 600; margin-top: 8px; }
  .rv-ph { display: flex; gap: 8px; margin-top: 10px; }
  .rv-ph button { width: 76px; height: 96px; padding: 0; border: 0; border-radius: 10px; overflow: hidden; background: var(--soft); cursor: zoom-in; }
  .rv-ph img { width: 100%; height: 100%; object-fit: cover; }
  .rv-src { font-size: 13px; color: var(--muted); text-align: center; margin-top: 14px; }

  .b2b { background: var(--ink); color: #fff; border-radius: var(--radius); padding: 24px 20px; display: grid; gap: 12px; }
  .b2b h2 { color: #fff; }
  .b2b .px { font-size: 22px; font-weight: 800; color: #ffb4a6; }
  .b2b p { margin: 0; opacity: .85; }

  .faq { margin-top: 18px; display: grid; gap: 8px; }
  .faq details { border: 1px solid var(--line); border-radius: 12px; padding: 0 16px; }
  .faq summary { cursor: pointer; padding: 14px 0; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
  .faq summary::after { content: "+"; font-size: 20px; line-height: 1; color: var(--accent); }
  .faq details[open] summary::after { content: "–"; }
  .faq details p { margin: 0 0 14px; color: var(--muted); }

  .final { background: var(--soft); border-radius: var(--radius); padding: 26px 20px; text-align: center; }
  .final p { margin: 8px 0 18px; color: var(--muted); }
  .final .btn { max-width: 420px; margin: 0 auto; }

  footer { border-top: 1px solid var(--line); padding: 24px 0 32px; font-size: 13px; color: var(--muted); }
  footer p { margin: 0 0 6px; }

  /* ---------- sticky bar ---------- */
  .sticky {
    position: fixed; left: 0; right: 0; bottom: var(--cookie-h, 0px); z-index: 40; background: #fff;
    border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 12px; align-items: center; transition: transform .2s;
  }
  .sticky.tucked { transform: translateY(120%); }
  
  
  
  
  .sticky .btn { flex: 1 1 auto; }
  .lead-form input[aria-invalid="true"] { border-color: #c62828; outline: 2px solid #c62828; }

  @media (min-width: 900px) { .sticky { display: none; } body { padding-bottom: var(--cookie-h, 0px); } }

  dialog.drawer {
    margin: auto 0 0 auto; height: 100dvh; max-height: 100dvh; width: min(440px, 100vw); max-width: 100vw;
    border: 0; padding: 0; background: #fff; color: var(--ink);
  }

  dialog.drawer::backdrop { background: rgba(0,0,0,.45); }

  .score-card .sc { font-size: 30px; font-weight: 800; line-height: 1; }

  };
  const OFFER_NAME_KEY = { bed: "o1n", mat: "o2n", set: "o3n", prem: "o4n", wholesale: "ow" };
  const OFFER_RU = { bed: "раскладушка БЕЗ матраса", mat: "раскладушка С МАТРАСОМ", set: "КОМПЛЕКТ раскладушка+матрас+чехол", prem: "ПРЕМИУМ комплект+бельё", wholesale: "ОПТ" };
  let pick = "set";      // выбранный вариант на странице
  let offer = "set";     // вариант в корзине (pick или wholesale)
  function calc() {
    const o = OFFERS[offer], goods = o.price * o.qty;
    const dl = o.free ? 0 : CONFIG.delivery;   // город уточняет оператор в WhatsApp, наценки за Рустави нет
    return { qty: o.qty, unit: o.price, goods: goods, dl: dl, sum: goods + dl };
  }

  function fill(str, extra) {
    const v = Object.assign({
      bed: money(CONFIG.priceBed), mat: money(CONFIG.priceMat), set: money(CONFIG.priceSet), prem: money(CONFIG.pricePremium),
      wholesale: money(CONFIG.priceWholesale), min: String(CONFIG.wholesaleMin),
      delivery: money(CONFIG.delivery), cutoff: CONFIG.cutoff,
      seller: CONFIG.legal.seller, id: CONFIG.legal.id, address: CONFIG.legal.address
    }, extra || {});
    return String(str).replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);
  }

  /* ---------- время по Тбилиси (UTC+4, без перехода на летнее) ---------- */
  function tbilisiNow() {
    const d = new Date();
    return new Date(d.getTime() + d.getTimezoneOffset() * 60000 + 4 * 3600000);
  }
  function delivery() {
    const now = tbilisiNow();
    const [h, m] = CONFIG.cutoff.split(":").map(Number);
    const cut = new Date(now); cut.setHours(h, m, 0, 0);
    const workday = now.getDay() !== 0;
    if (workday && now < cut) return { today: true, left: cut - now };
    const next = new Date(now); next.setDate(next.getDate() + 1);
    if (next.getDay() === 0) next.setDate(next.getDate() + 1);
    const plus1 = new Date(now.getTime() + 86400000);
    return { today: false, date: next, tomorrow: next.getDate() === plus1.getDate() };
  }
  function fmtDate(d) {
    const t = I18N[lang];
    return t.dows[d.getDay()] + ", " + d.getDate() + "." + String(d.getMonth() + 1).padStart(2, "0");
  }
  function fmtLeft(ms) {
    const mins = Math.max(1, Math.floor(ms / 60000));
    const h = Math.floor(mins / 60), m = mins % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m + " min").replace("min", lang === "ru" ? "мин" : lang === "ka" ? "წთ" : "min");
  }
  function renderDelivery() {
    const t = I18N[lang], d = delivery(), now = tbilisiNow();
    $('[data-tl="today"]').textContent = fmtDate(now);
    $('[data-tl="tbilisi"]').textContent = d.today ? t.today : d.tomorrow ? t.tomorrow + ", " + fmtDate(d.date) : fmtDate(d.date);
    $('[data-tl="rustavi"]').textContent = t.rustaviEta;
    $('[data-dr="deadline"]').textContent = d.today
      ? fill(t.deadlineToday, { left: fmtLeft(d.left) })
      : fill(t.deadlineTomorrow, { day: d.tomorrow ? t.tomorrow + ", " + fmtDate(d.date) : fmtDate(d.date) });
  }

  function renderPrices() {
    const P = {
      bed: money(CONFIG.priceBed), mat: money(CONFIG.priceMat), set: money(CONFIG.priceSet), prem: money(CONFIG.pricePremium),
      cur: money(OFFERS[pick].price), delivery: money(CONFIG.delivery), wholesale: money(CONFIG.priceWholesale)
    };
    $$("[data-price]").forEach(el => { el.textContent = P[el.dataset.price]; });
  }

  function render() {
    const t = I18N[lang];
    document.documentElement.lang = lang;
    document.title = t.pageTitle;
    $$("[data-i18n]").forEach(el => { const k = el.dataset.i18n; if (t[k] != null) el.textContent = fill(t[k]); });
    $$("[data-i18n-html]").forEach(el => { const k = el.dataset.i18nHtml; if (t[k] != null) el.innerHTML = fill(t[k]); });
    $$("[data-i18n-alt]").forEach(el => { el.alt = t[el.dataset.i18nAlt] || ""; });
    $$("[data-src-lang]").forEach(el => { el.src = el.dataset.srcLang.replace("{lang}", lang); });
    renderPrices();
    $$(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

    const list = $("#reviews-list"); list.textContent = "";
    REVIEWS.slice().sort((a, b) => (b.ph ? 1 : 0) - (a.ph ? 1 : 0)).forEach(r => {
      const card = document.createElement("article"); card.className = "rv";
      const d = new Date(r.d + "T12:00:00");
      const date = d.toLocaleDateString(lang === "ka" ? "ka-GE" : lang === "ru" ? "ru-RU" : "en-GB", { day: "numeric", month: "long", year: "numeric" });
      card.innerHTML = '<div class="who"><b></b><span class="stars">★★★★★</span></div><div class="muted" style="font-size:13px"></div><p></p><div class="ver"></div>';
      card.querySelector("b").textContent = r.n;
      card.querySelector(".muted").textContent = date;
      card.querySelector("p").textContent = r[lang];
      card.querySelector(".ver").textContent = t.verified;
      if (r.ph) {
        const row = document.createElement("div"); row.className = "rv-ph";
        r.ph.forEach((src, i) => {
          const b = document.createElement("button"); b.type = "button";
          const im = document.createElement("img"); im.src = src; im.alt = ""; im.loading = "lazy";
          b.appendChild(im); b.addEventListener("click", () => openLb(r.ph, i)); row.appendChild(b);
        });
        card.insertBefore(row, card.querySelector(".ver"));
      }
      list.appendChild(card);
    });

    const faq = $("#faq"); faq.textContent = "";
    t.faq.forEach(([q, a]) => {
      const d = document.createElement("details");
      d.innerHTML = "<summary></summary><p></p>";
      d.querySelector("summary").textContent = q;
      d.querySelector("p").textContent = fill(a);
      faq.appendChild(d);
    });

    renderDelivery();
    renderCart();
  }

  /* ---------- галерея ---------- */
  const slides = $("#slides"), thumbs = $$("#thumbs button");
  function markThumb(i) { thumbs.forEach((b, j) => b.setAttribute("aria-current", String(i === j))); }
  thumbs.forEach((b, i) => b.addEventListener("click", () => {
    slides.scrollTo({ left: i * slides.clientWidth, behavior: "smooth" });
  }));
  slides.addEventListener("scroll", () => {
    const i = Math.round(slides.scrollLeft / slides.clientWidth);
    markThumb(i);
    $$("#slides video").forEach(v => {
      const on = v.closest(".slide") === slides.children[i];
      if (on && v.paused) v.play().catch(() => {}); else if (!on && !v.paused) v.pause();
    });
  }, { passive: true });
  markThumb(0);
  /* звук ролика в галерее: автозапуск только без звука, включается кнопкой */
  $$("#slides .snd").forEach(b => b.addEventListener("click", () => {
    const v = b.parentElement.querySelector("video");
    v.muted = !v.muted; b.textContent = v.muted ? "🔇" : "🔊";
    if (v.paused) v.play().catch(() => {});
  }));

  /* ---------- фото покупателей: лайтбокс ---------- */
  /* лайтбокс-карусель: листается свайпом, стрелками и клавишами */
  const lb = $("#lb"), lbTrack = $("#lb-track"), count = $("#lb-count");
  function openLb(srcs, i) {
    lbTrack.textContent = "";
    srcs.forEach(src => {
      const f = document.createElement("figure"), isVid = /\.mp4$/.test(src);
      const el = document.createElement(isVid ? "video" : "img");
      if (isVid) Object.assign(el, { muted: true, loop: true, playsInline: true, controls: true, preload: "metadata", poster: src.replace(/\.mp4$/, ".jpg") });
      else el.alt = "";
      /* картинки из лид-формы: в полноэкранном просмотре оригиналы 3:4 без размытых полей */
      el.src = src.replace(/\/(hero|p\d)\.jpg$/, "/$1-full.jpg"); f.appendChild(el); lbTrack.appendChild(f);
    });
    lb.showModal();
    lbTrack.scrollLeft = i * lbTrack.clientWidth;
    lbCount();
  }
  const lbIdx = () => Math.round(lbTrack.scrollLeft / lbTrack.clientWidth);
  function lbCount() {
    const i = lbIdx();
    count.textContent = (i + 1) + " / " + lbTrack.children.length;
    /* играет только видео на текущем слайде */
    [...lbTrack.children].forEach((f, j) => { const v = f.querySelector("video"); if (v) j === i ? v.play().catch(() => {}) : v.pause(); });
  }
  function lbGo(d) {
    const n = lbTrack.children.length, i = (lbIdx() + d + n) % n;
    lbTrack.scrollTo({ left: i * lbTrack.clientWidth, behavior: "smooth" });
  }
  lbTrack.addEventListener("scroll", lbCount, { passive: true });
  $(".lb-prev").addEventListener("click", () => lbGo(-1));
  $(".lb-next").addEventListener("click", () => lbGo(1));
  $(".lb-x").addEventListener("click", () => lb.close());
  lbTrack.addEventListener("click", e => { if (!/^(IMG|VIDEO)$/.test(e.target.tagName)) lb.close(); });
  lb.addEventListener("close", () => { lbTrack.textContent = ""; });
  lb.addEventListener("keydown", e => { if (e.key === "ArrowLeft") lbGo(-1); if (e.key === "ArrowRight") lbGo(1); });
  const mediaBtns = $$("#media-grid button");
  mediaBtns.forEach((b, i) => b.addEventListener("click", () => openLb(mediaBtns.map(x => x.dataset.src), i)));
  /* видео в сетке крутятся без звука, только пока видны на экране */
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(es => es.forEach(e => {
      const v = e.target; e.isIntersecting && !lb.open ? v.play().catch(() => {}) : v.pause();
    }), { threshold: .4 });
    $$("#media-grid video").forEach(v => io.observe(v));
  }
  const galImgs = $$("#slides img");
  galImgs.forEach((im, i) => im.addEventListener("click", () => openLb(galImgs.map(x => x.src), i)));

  /* ---------- пакеты ---------- */
  $$('input[name="pack"], input[name="pack2"], input[name="fpack"]').forEach(r => r.addEventListener("change", () => { pick = offer = r.value; renderPrices(); renderCart(); }));
  const gal2 = $$("#slides2 img");
  gal2.forEach((im, i) => im.addEventListener("click", () => openLb(gal2.map(x => x.src), i)));

  /* ---------- корзина ---------- */
  const dlg = $("#order");
  function renderCart() {
    const t = I18N[lang], c = calc();
    $("#li-name").textContent = fill(t[OFFER_NAME_KEY[offer]]);
    $("#li-sum").textContent = money(c.goods);
    $("#li-old").textContent = "";
    $("#t-goods").textContent = money(c.goods);
    $("#t-del").textContent = c.dl ? money(c.dl) : t.free;
    $("#t-sum").textContent = money(c.sum);
    $("#btn-sum").textContent = money(c.sum);
    $$('input[name="pack"], input[name="pack2"], input[name="fpack"]').forEach(x => { x.checked = x.value === offer; });
  }

  $$("[data-open-order]").forEach(b => b.addEventListener("click", () => {
    offer = b.dataset.offer || pick;
    const fromBar = !!b.closest("#sticky");   // с плавающей кнопки вариант ещё не выбран: показываем выбор из трёх
    $("#dr-packs").hidden = !fromBar; $("#li-row").hidden = fromBar;
    renderCart(); renderDelivery();
    dlg.showModal(); window.dispatchEvent(new Event("resize"));
    track("OpenOrderForm", b.id || "cta");
  }));
  $$("[data-close]").forEach(b => b.addEventListener("click", () => dlg.close()));
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

  /* ---------- липкая панель: только после блока «в комплекте» и после главной кнопки ---------- */
  (function () {
    const bar = $("#sticky"), cta = $("#main-cta"), kit = document.querySelector(".kit-title");
    if (!bar || !cta || !kit) return;
    let raf = 0;
    function update() {
      raf = 0;
      const vh = window.innerHeight || document.documentElement.clientHeight;
      const reached = kit.getBoundingClientRect().top < vh * 0.85;
      const passed = cta.getBoundingClientRect().bottom < 0;
      bar.classList.toggle("tucked", !(reached && passed) || dlg.open);
    }
    function req() { if (!raf) raf = requestAnimationFrame(update); }
    window.addEventListener("scroll", req, { passive: true });
    window.addEventListener("resize", req);
    dlg.addEventListener("close", req);
    dlg.addEventListener("cancel", req);
    update();
  })();

  /* ---------- аналитика ---------- */
  function track(event, channel) {
    const meta = { content_name: channel, source: SRC, lang: lang, campaign: CAMPAIGN || "none", page: PAGE };
    if (event === "Lead") { const c = calc(); meta.value = c.goods; meta.currency = "GEL"; meta.num_items = c.qty; meta.offer = offer; }
    let c = null; try { c = localStorage.getItem("odra.consent.ads"); } catch (e) {}
    if (window.fbq && c !== "no") window.fbq(STD_EVENTS.includes(event) ? "track" : "trackCustom", event, meta);
  }
  const STD_EVENTS = ["InitiateCheckout", "Lead", "Purchase"];

  /* InitiateCheckout = человек ввёл имя и настоящий грузинский мобильный (5XX XX XX XX), а не просто открыл форму.
     На это событие оптимизируется реклама, поэтому пустые нажатия «Заказать» сюда не попадают. Один раз за визит. */
  function realPhone(v) {
    let d = String(v).replace(/\D/g, "");
    if (d.length === 12 && d.startsWith("995")) d = d.slice(3);
    if (d.length !== 9 || d[0] !== "5") return false;
    if (/^(\d)\1+$/.test(d.slice(1)) || "123456789".includes(d) || "987654321".includes(d)) return false;
    return true;
  }
  /* приводим любой формат номера (8 555…, 0555…, 00995…, +995…, с пробелами/скобками) к +995 5XX XX XX XX */
  function normPhone(v) {
    let d = String(v).replace(/\D/g, "");
    if (d.startsWith("00")) d = d.slice(2);
    if (d.startsWith("995") && d.length >= 12) d = d.slice(3);
    else if ((d[0] === "0" || d[0] === "8") && d.length === 10) d = d.slice(1);
    if (d.length !== 9) return null;
    return "+995 " + d.slice(0, 3) + " " + d.slice(3, 5) + " " + d.slice(5, 7) + " " + d.slice(7);
  }
  function fixPhone(force) {
    const p = $("#lead-form").elements.phone, n = normPhone(p.value);
    if (n && n !== p.value) p.value = n;
    if (n) p.removeAttribute("aria-invalid");
  }
  $("#lead-form").elements.phone.addEventListener("input", () => fixPhone());
  $("#lead-form").elements.phone.addEventListener("blur", () => fixPhone());
  $("#lead-form").elements.phone.addEventListener("paste", () => setTimeout(fixPhone, 0));
  let checkoutSent = false;
  function checkCheckout() {
    const F = $("#lead-form").elements;
    if (checkoutSent || F.name.value.trim().length < 2 || !realPhone(F.phone.value)) return;
    checkoutSent = true;
    track("InitiateCheckout", "phone");
  }
  ["input", "change", "blur"].forEach(t => {
    $("#lead-form").elements.phone.addEventListener(t, checkCheckout);
    $("#lead-form").elements.name.addEventListener(t, checkCheckout);
  });

  /* ---------- отправка заказа (Web3Forms, как на основном сайте) ---------- */
  const form = $("#lead-form"), msg = form.querySelector(".form-msg");
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const t = I18N[lang];
    fixPhone();
    const F = form.elements, name = F.name.value.trim(), phone = F.phone.value.trim();
    F.name.removeAttribute("aria-invalid"); F.phone.removeAttribute("aria-invalid");
    if (!name || phone.replace(/\D/g, "").length < 9) {
      const noName = !name;
      (noName ? F.name : F.phone).setAttribute("aria-invalid", "true");
      msg.className = "form-msg err"; msg.textContent = noName ? t.fNeed : t.fPhoneBad; msg.hidden = false;
      (noName ? F.name : F.phone).focus(); return;
    }
    const c = calc(), sum = c.sum;
    F.qty.value = c.qty; F.offer.value = offer;
    F.total.value = sum + " GEL (" + c.qty + " x " + c.unit + " + доставка " + c.dl + ")";
    F.lang.value = lang; F.source.value = SRC; F.campaign.value = CAMPAIGN || "none";
    const fd = new FormData(form);
    fd.set("access_key", CONFIG.formKey);
    fd.set("from_name", CONFIG.brand + " — сайт v3" + (window.__DRAFT__ ? " ЧЕРНОВИК-ТЕСТ" : ""));
    fd.set("subject", CONFIG.brand + (window.__DRAFT__ ? " ЧЕРНОВИК-ТЕСТ" : "") + ": ЗАКАЗ с сайта [" + lang + "] " + OFFER_RU[offer] + ", " + sum + " GEL, " + fd.get("city"));
    const btn = form.querySelector('button[type="submit"]'); btn.disabled = true;
    try {
      const r = await fetch(CONFIG.formEndpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(Object.fromEntries(fd))
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || data.success !== true) throw new Error(data.message || r.status);
      /* заказ ушёл → страница «Спасибо» (там пиксель шлёт Purchase — цель рекламы, один раз на заказ) */
      const oid = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const ty = (window.__DRAFT__ ? { ka: "/v3/spasibo-draft/", ru: "/v3/spasibo-draft/ru/", en: "/v3/spasibo-draft/en/" } : { ka: "/spasibo/", ru: "/ru/spasibo/", en: "/en/spasibo/" })[lang];
      const tq = new URLSearchParams({ id: oid, n: c.qty, v: sum, dl: c.dl, o: offer, src: SRC, c: CAMPAIGN || "none" });
      try { location.assign(ty + "?" + tq); return; } catch (e) {}
      const done = document.createElement("div"); done.className = "done";
      done.innerHTML = '<div class="ok">✅</div><h3></h3><p class="muted"></p><a class="btn btn-wa" target="_blank" rel="noopener"></a>';
      done.querySelector("h3").textContent = t.okTitle;
      done.querySelector("p").textContent = t.okText;
      const wa = done.querySelector("a");
      wa.textContent = t.okWa;
      wa.href = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(fill(t.waText, { qty: c.qty }));
      form.replaceWith(done);
    } catch (e) {
      btn.disabled = false;
      msg.className = "form-msg err"; msg.textContent = t.fErr; msg.hidden = false;
    }
  });

  /* ---------- язык ---------- */
  $$(".langs button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("lang", lang); } catch (e) {}
    const u = new URL(location.href); u.searchParams.set("lang", lang); history.replaceState(null, "", u);
    render();
  }));

  /* ---------- пиксель Meta: включён сразу, плашка-уведомление с кнопкой «Отказаться» ---------- */
  const CONSENT_KEY = "odra.consent.ads";
  function startPixel() {
    if (!CONFIG.pixelId || window.fbq || window.__DRAFT__) return;
    !function (f, b, e, v, n, t, s) {
      if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments) };
      if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = "2.0"; n.queue = [];
      t = b.createElement(e); t.async = !0; t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s)
    }(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
    window.fbq("init", CONFIG.pixelId);
    window.fbq("track", "PageView");
  }
  function setCookieH(px) { document.documentElement.style.setProperty("--cookie-h", Math.ceil(px) + "px"); }
  (function consent() {
    let c = null; try { c = localStorage.getItem(CONSENT_KEY); } catch (e) {}
    if (c !== "no") startPixel();
    if (c === "yes" || c === "no") return;
    const bar = $("#cookie-bar"); bar.hidden = false;
    const measure = () => !bar.hidden && setCookieH(bar.getBoundingClientRect().height);
    measure(); window.addEventListener("resize", measure);
    if (window.ResizeObserver) new ResizeObserver(measure).observe(bar);
    const decide = v => { try { localStorage.setItem(CONSENT_KEY, v); } catch (e) {} bar.hidden = true; setCookieH(0); if (v === "no" && window.fbq) window.fbq("consent", "revoke"); };
    $("#cookie-yes").addEventListener("click", () => decide("yes"));
    $("#cookie-no").addEventListener("click", () => decide("no"));
  })();

  render();
  setInterval(renderDelivery, 30000);
})();
</script>
</body>
</html>
